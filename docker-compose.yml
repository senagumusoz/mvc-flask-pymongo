services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: flask-app
    ports:
      - "5001:5000"
    depends_on:
       mongo:
         condition: service_healthy


volumes:
  mongo_data:
